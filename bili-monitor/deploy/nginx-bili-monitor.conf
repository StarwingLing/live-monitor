# Nginx 反代配置（实际部署形态；2026-09-12 实测验证，2026-09-16 v0.5 起
# 移除 Basic Auth——登录改由应用内登录页承担，见下）
#
# 两个关键点（都踩过坑）：
# 1. IP 直接访问时 Host 不固定，独立 server 块不会被 default_server 选中，
#    location 必须放进 /etc/nginx/conf.d/00-default.conf 的 default_server 内；
# 2. proxy_pass **不带末尾斜杠**（保留 /bili-monitor 前缀转发），与应用的
#    FastAPI(root_path="/bili-monitor") 配套——若剥掉前缀，路由正常但
#    /static 挂载会 404（实测）。
#
# 部署/修改步骤：
#   1. 编辑服务器 /etc/nginx/conf.d/00-default.conf，在 server 块内加入
#      下面的 location 块（把原有的 `return 404;` 改为 `location / { return 404; }` 兜底）；
#   2. v0.5 起 auth_basic 两行已删除：认证由应用内登录页（管理员账号/游客码
#      双角色 + 签名 Cookie）承担；htpasswd 文件 /etc/nginx/.htpasswd_bili
#      保留不动，需要回退 Nginx Basic Auth 时加回这两行即可：
#        auth_basic "bili-monitor";
#        auth_basic_user_file /etc/nginx/.htpasswd_bili;
#   3. nginx -t && systemctl reload nginx。

server {
    listen 80;
    location /bili-monitor/ {
        proxy_pass http://127.0.0.1:8001;   # 不带斜杠：保留前缀，配合 app root_path
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;  # WebSocket
        proxy_set_header Connection "upgrade";
    }
}
