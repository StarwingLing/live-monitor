# replay 回放站 Nginx 反代配置（部署形态）
#
# 加入方式：编辑服务器 /etc/nginx/conf.d/00-default.conf，在其 server 块内
# （与 location /bili-monitor/ 平级）加入下面的 location 块，然后
# nginx -t && systemctl reload nginx。
#
# 两个关键点（同 bili-monitor 的踩坑结论）：
# 1. IP 直接访问时 Host 不固定，location 必须放进 00-default.conf 的
#    default_server server 块内；
# 2. proxy_pass **不带末尾斜杠**（保留 /replay 前缀转发），与应用的
#    FastAPI(root_path="/replay") 配套——若剥掉前缀，/static 挂载会 404。

location /replay/ {
    proxy_pass http://127.0.0.1:8003;   # 不带斜杠：保留前缀，配合 app root_path
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
}
